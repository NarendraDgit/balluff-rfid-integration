[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accurate-it7"
version = "0.1.0"
description = "UDP protocol client for Accurate IT7 Measure / Balluff integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Accurate Engineering integration"}]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
it7-test = "it7.cli:main"
it7-gui = "it7.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"